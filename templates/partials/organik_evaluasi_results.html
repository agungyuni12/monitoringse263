{{define "organik_evaluasi_results.html"}}
{{if .Results}}
{{range .Results}}
<div
  hx-get="/organik/assignment/{{urlPathEscape .AssignmentID}}/perbaikan/modal"
  hx-target="#modal-content"
  hx-swap="innerHTML"
  hx-on::after-request="openModal(); document.getElementById('assignment-search').value=''; this.parentElement.innerHTML='';"
  class="px-4 py-3 cursor-pointer hover:bg-orange-50 dark:hover:bg-gray-700 border-b border-gray-100 dark:border-gray-700 last:border-0 transition-colors">
  <div class="flex items-center justify-between gap-2">
    <div class="font-medium text-gray-800 dark:text-gray-100 text-sm">{{.NamaUsaha}}</div>
    {{if gt .JmlPerbaikan 0}}
    <span class="shrink-0 text-xs font-semibold text-se bg-se-bg dark:bg-gray-800 px-1.5 py-0.5 rounded-full">{{.JmlPerbaikan}} catatan</span>
    {{end}}
  </div>
  <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
    {{.NamaSLS}}, {{.NamaDesa}}, Kec. {{.NamaKec}} &bull; PPL: {{.NamaPPL}}
  </div>
</div>
{{end}}
{{else}}
<div class="px-4 py-3 text-sm text-gray-400 dark:text-gray-500">Tidak ada assignment yang sesuai.</div>
{{end}}
{{end}}
