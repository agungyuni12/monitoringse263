{{define "perbaikan_status_badge"}}
{{if eq . "resolved"}}
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400">
  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
  Selesai
</span>
{{else}}
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400">
  <svg class="w-2 h-2 fill-current" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4"/></svg>
  Terbuka
</span>
{{end}}
{{end}}

{{define "jenis_kesalahan_badge"}}
<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-se-bg dark:bg-gray-800 text-se">{{jenisKesalahanLabel .}}</span>
{{end}}
